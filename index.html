<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsField — Platform Troubleshooting</title><style>body{margin:0;background:#0b1220;color:#e2e8f0;font:16px system-ui}header{background:#111e32;padding:22px;border-bottom:1px solid #334155}main{max-width:1080px;margin:auto;padding:25px}h1{margin:0}small,.muted{color:#94a3b8}nav{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}button,input,select,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid #42526a;background:#1c2c44;color:#e2e8f0}button{cursor:pointer}button:hover{background:#264968}.selected{background:#087f71}section{display:none}section.active{display:block}.card{background:#111e32;padding:18px;border:1px solid #30425b;border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}code,pre{font:14px ui-monospace,Consolas,monospace;color:#75e4cc;white-space:pre-wrap;overflow-wrap:anywhere}input,textarea{box-sizing:border-box;width:100%}.tag{color:#5eead4}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.copy{font-size:13px}.note{border-left:3px solid #eab308;padding:12px;background:#2b2517}a{color:#67e8f9}</style><header><h1>⚡ OpsField</h1><small>Platform troubleshooting workbench • On-call • Labs • Interviews</small></header><main><nav id="nav"></nav><div id="content"></div></main><script>
const cmds=[
["Discovery","hostnamectl","Identify the OS, hostname and virtualization platform."],["Discovery","systemctl list-units --type=service --state=running","Find running systemd services; failed services are absent."],["Discovery","systemctl --failed","Find failed systemd units."],["Discovery","sudo ss -lntp","See listening TCP ports, bound IPs, processes and PIDs."],["Discovery","ps auxww","Inspect running processes and complete command lines."],["Discovery","systemctl list-unit-files --type=service","Discover installed service definitions, including inactive ones."],["Service","systemctl status SERVICE","Inspect service state and recent messages."],["Service","journalctl -u SERVICE -n 100 --no-pager","Inspect recent service logs."],["Service","systemctl cat SERVICE","Find the effective service unit configuration."],["Service","systemctl show SERVICE -p MainPID -p ExecStart","Inspect systemd PID and configured execution."],["Service","sudo systemctl daemon-reload","Reload unit definitions after editing unit files; does not restart services."],["Service","sudo systemctl restart SERVICE","Restart service; consider impact before production use."],["Network","curl -v http://127.0.0.1:8080","Test HTTP locally and inspect connection details."],["Network","getent hosts HOSTNAME","Resolve hostname through configured system name services."],["Network","ip -br addr","Show interfaces and IP addresses."],["Network","ip route","Show routing table."],["Network","sudo ss -ntp","Inspect TCP sessions and owning processes."],["Network","ping -c 3 HOSTNAME","Check ICMP reachability; blocked ICMP does not prove service down."],["Resources","free -h","Inspect RAM and swap."],["Resources","top","Observe CPU and process activity."],["Resources","df -h","Find full mounted filesystems."],["Resources","df -i","Find inode exhaustion."],["Resources","sudo du -xhd1 /var","Identify large directories on the /var filesystem."],["Resources","sudo lsof +L1","Find open deleted files still consuming disk."],["Resources","dmesg -T | tail -60","Inspect recent kernel messages; access may require sudo."],["Containers","docker ps -a","List running and stopped Docker containers."],["Containers","docker logs --tail 100 CONTAINER","View Docker container output."],["Kubernetes","kubectl get pods -A -o wide","Find Kubernetes pod status and placement."],["Kubernetes","kubectl describe pod POD -n NAMESPACE","Inspect scheduling, probes, and events."],["Kubernetes","kubectl logs POD -n NAMESPACE --previous","Inspect prior crashed container instance."]];
const incidents=[
{symptom:"Connection refused",cause:"No listener at the destination socket, loopback-only binding, or active firewall rejection.",commands:["getent hosts HOSTNAME","curl -v http://127.0.0.1:8080","sudo ss -lntp","systemctl --failed"],next:"Compare local and remote tests. Validate IP, port, bind address and owner before restarting anything."},
{symptom:"Connection timed out",cause:"Packets dropped, missing route, firewall, unhealthy upstream or inaccessible host.",commands:["ip route","ip -br addr","getent hosts HOSTNAME","sudo ss -lntp"],next:"Trace whether the request reaches the host and check firewall and routing along the path."},
{symptom:"status=203/EXEC",cause:"systemd could not execute ExecStart: wrong path, permission or invalid executable.",commands:["systemctl cat SERVICE","journalctl -u SERVICE -n 100 --no-pager","systemctl status SERVICE"],next:"Inspect ExecStart, file existence, executable bit and interpreter. Change only after evidence."},
{symptom:"No space left on device",cause:"Filesystem full or inodes exhausted; sometimes deleted files remain open.",commands:["df -h","df -i","sudo du -xhd1 /var","sudo lsof +L1"],next:"Identify mount and consumers. Do not delete active production files blindly."},
{symptom:"OOMKilled / out of memory",cause:"Memory pressure or container memory limits.",commands:["free -h","top","dmesg -T | tail -60"],next:"Find the killed PID, service memory footprint, limits, and triggering workload."},
{symptom:"DNS resolution failure",cause:"Resolver settings, DNS record, search domain or network path to resolvers.",commands:["getent hosts HOSTNAME","ip route","ip -br addr"],next:"Separate DNS resolution from TCP connectivity."},
{symptom:"CrashLoopBackOff",cause:"Container repeatedly terminates, often due to app crash, bad command or failed probes.",commands:["kubectl get pods -A -o wide","kubectl describe pod POD -n NAMESPACE","kubectl logs POD -n NAMESPACE --previous"],next:"Review previous container logs and events before modifying Kubernetes deployment."}
];
const labs=[["Discover the mystery app","No app name provided. Locate a workload by a reported IP and port. Follow sockets → PID → process → service. This lab is investigation only."],["203/EXEC systemd failure","In a disposable VM, intentionally change a service ExecStart to a nonexistent executable, observe status and logs, restore it and verify."],["Loopback binding","Bind Python HTTP server to 127.0.0.1 and compare curl from inside the VM with curl from Windows to the VM IP."],["Disk exhaustion","Attach a separate disposable filesystem, fill it with a controlled test file, measure df and du, then clean the test file."],["High CPU","Run a controlled CPU-bound task on a disposable VM; identify the consuming PID with top and ps before stopping it."]];
const interviews=[["An app is down. What do you ask first?","Confirm impact, environment, exact endpoint and error, onset, scope, recent changes, ownership and deployed location. Determine urgency and safe access before host troubleshooting."],["A port refuses a connection, but systemctl is active. Explain.","Service active is not endpoint healthy. It may bind only to 127.0.0.1, listen on the wrong port, have a failing reverse proxy, or be blocked by an active rejection."],["How do you discover an unknown Linux service?","Start with host identification, ss -lntp, process PID and command, systemctl status or cgroup; if nothing listens, inspect failed units, config and logs. Don't assume service name."],["What does 203/EXEC mean?","systemd failed to execute the process. Validate ExecStart path, executable permissions, shebang and interpreter, plus detailed journal messages."],["What happens after you edit a systemd unit?","Run daemon-reload to load the changed definition, then deliberately restart or otherwise activate the unit as appropriate. Verify health and logs."],["How is HA different from vMotion?","vMotion live-migrates a working VM for planned maintenance. vSphere HA restarts VMs on surviving hosts after failure, so recovery is not zero downtime."]];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cmd(s){return '<div class="row"><code>'+esc(s)+'</code><button class="copy" data-copy="'+esc(s)+'">Copy</button></div>'}
function start(){let tabs=["Start","Triage","Errors","Commands","Labs","Interview","Incident report"];document.getElementById("nav").innerHTML=tabs.map((t,i)=>'<button data-tab="'+i+'" class="'+(i===0?"selected":"")+'">'+t+'</button>').join("");document.getElementById("content").innerHTML=tabs.map((t,i)=>'<section id="t'+i+'" class="'+(i===0?"active":"")+'"></section>').join("");document.getElementById("t0").innerHTML='<h2>Start with evidence, not assumptions</h2><p>Your pocket reference for incident response, training and interviews. Commands are examples: replace placeholders and check impact before using them.</p><div class="grid"><div class="card"><h3>01 Discover</h3>Confirm endpoint, environment, application ownership and host.</div><div class="card"><h3>02 Observe</h3>Find sockets, processes, service state and logs.</div><div class="card"><h3>03 Diagnose</h3>Write a testable hypothesis and gather confirming evidence.</div><div class="card"><h3>04 Repair & document</h3>Change safely, verify externally and record the root cause.</div></div><div class="note">Your Ubuntu lab: lab-web is active and Python PID 2863 listens on 127.0.0.1:8080. This is NOT externally reachable through the VM IP by default. PID values may change after restart.</div>';
document.getElementById("t1").innerHTML='<h2>Incident triage</h2><p>Ask: What endpoint? Which environment? Who is affected? When did it begin? What recently changed? Who owns it?</p><label>Observed symptom</label><select id="symptom">'+incidents.map((i,k)=>'<option value="'+k+'">'+esc(i.symptom)+'</option>').join('')+'</select><div id="diagnosis"></div>';document.getElementById("symptom").onchange=triage;triage();
document.getElementById("t2").innerHTML='<h2>Error decoder</h2><input id="errsearch" placeholder="Search errors, causes, commands..."><div id="errresults"></div>';document.getElementById("errsearch").oninput=errors;errors();
document.getElementById("t3").innerHTML='<h2>Command reference</h2><input id="cmdsearch" placeholder="Search command, purpose or category..."><div id="cmdresults"></div>';document.getElementById("cmdsearch").oninput=commands;commands();
document.getElementById("t4").innerHTML='<h2>Safe break-and-fix labs</h2><p>Use your own disposable Ubuntu VM, snapshot it first, never run fault injection on production.</p>'+labs.map((l,k)=>'<div class="card"><h3>Lab '+(k+1)+': '+esc(l[0])+'</h3><p>'+esc(l[1])+'</p><label><input style="width:auto" type="checkbox" data-lab="'+k+'"> Completed</label></div>').join('');document.querySelectorAll('[data-lab]').forEach(e=>{e.checked=localStorage.getItem("lab"+e.dataset.lab)==="true";e.onchange=()=>localStorage.setItem("lab"+e.dataset.lab,e.checked)});
document.getElementById("t5").innerHTML='<h2>Senior engineer interview practice</h2>'+interviews.map((q,k)=>'<div class="card"><h3>'+esc(q[0])+'</h3><button data-answer="'+k+'">Reveal example answer</button><p id="answer'+k+'" hidden>'+esc(q[1])+'</p></div>').join('');document.querySelectorAll('[data-answer]').forEach(e=>e.onclick=()=>{let p=document.getElementById("answer"+e.dataset.answer);p.hidden=!p.hidden});
document.getElementById("t6").innerHTML='<h2>Incident report builder</h2><p>Keep confidential infrastructure, production IPs and credentials out of public repositories.</p>'+["Title","Impact","Timeline","Evidence","Root cause","Mitigation and verification","Follow-up prevention"].map(k=>'<label>'+k+'</label><textarea data-field="'+esc(k)+'" rows="3" placeholder="'+esc(k)+'"></textarea>').join('')+'<p><button id="export">Download Markdown report</button></p>';document.getElementById("export").onclick=()=>{let d="# Incident report\n\n"+[...document.querySelectorAll("[data-field]")].map(x=>"## "+x.dataset.field+"\n\n"+x.value).join("\n\n");let u=URL.createObjectURL(new Blob([d],{type:"text/markdown"}));let a=document.createElement("a");a.href=u;a.download="incident-report.md";a.click();URL.revokeObjectURL(u)};
document.getElementById("nav").onclick=e=>{let t=e.target.closest("[data-tab]");if(!t)return;document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("selected",b===t));document.querySelectorAll("section").forEach(s=>s.classList.toggle("active",s.id==="t"+t.dataset.tab))};document.addEventListener("click",e=>{let b=e.target.closest("[data-copy]");if(b)navigator.clipboard.writeText(b.dataset.copy).then(()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1200)})})}
function triage(){let i=incidents[Number(document.getElementById("symptom").value)];document.getElementById("diagnosis").innerHTML='<div class="card"><h3>Likely explanations — hypotheses, not proof</h3><p>'+esc(i.cause)+'</p><h4>First safe checks</h4>'+i.commands.map(cmd).join('')+'<h4>What next?</h4><p>'+esc(i.next)+'</p></div>'}
function errors(){let q=document.getElementById("errsearch").value.toLowerCase();document.getElementById("errresults").innerHTML=incidents.filter(i=>JSON.stringify(i).toLowerCase().includes(q)).map(i=>'<div class="card"><h3>'+esc(i.symptom)+'</h3><p>'+esc(i.cause)+'</p>'+i.commands.map(cmd).join('')+'<p class="muted">'+esc(i.next)+'</p></div>').join('')||'<p>No exact match. Search a broader symptom.</p>'}
function commands(){let q=document.getElementById("cmdsearch").value.toLowerCase();document.getElementById("cmdresults").innerHTML=cmds.filter(i=>i.join(" ").toLowerCase().includes(q)).map(i=>'<div class="card"><small class="tag">'+esc(i[0])+'</small>'+cmd(i[1])+'<p>'+esc(i[2])+'</p></div>').join('')||'<p>No command matches.</p>'}
start();</script></html>
